<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miracolo Lab - News Radar</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  color:white;
  font-family:Arial,sans-serif;
  padding:25px;
}
.box{
  max-width:700px;
  margin:auto;
  background:#121923;
  border:1px solid #263241;
  border-radius:18px;
  padding:25px;
}
button{
  width:100%;
  padding:18px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:18px;
  font-weight:bold;
}
#results{
  margin-top:20px;
}
.item{
  padding:15px 0;
  border-top:1px solid #263241;
}
a{
  color:#93c5fd;
}
</style>
</head>

<body>

<div class="box">

<h1>🪄 Miracolo Lab</h1>

<p>Radar investibile — News + Social</p>

<button onclick="scan()">
🔎 SCANSIONA NEWS
</button>

<div id="status">
Pronto
</div>

<div id="results"></div>

</div>

<script>

async function scan(){

  const status =
    document.getElementById("status");

  const results =
    document.getElementById("results");

  status.innerHTML =
    "🔄 Scansione in corso...";

  results.innerHTML = "";

  try{

    const response =
      await fetch(
        "/api/full-scan?x=" +
        Date.now()
      );

    const data =
      await response.json();

    status.innerHTML =
      "✅ Scansione completata — " +
      (data.summary?.news || 0) +
      " news / " +
      (data.summary?.social || 0) +
      " social";

    (data.top_signals || [])
      .forEach(function(item){

        results.innerHTML +=

          '<div class="item">' +

          '<b>' +
          (item.source || "") +
          '</b><br><br>' +

          '<a href="' +
          item.link +
          '" target="_blank">' +
          (item.title || "") +
          '</a>' +

          '<p>' +
          (item.description || "") +
          '</p>' +

          '<small>Score: ' +
          (item.score || 0) +
          '</small>' +

          '</div>';

      });

  }catch(error){

    status.innerHTML =
      "❌ Errore: " +
      error.message;

  }

}

</script>

</body>
</html>
