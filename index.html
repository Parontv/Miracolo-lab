<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miracolo Lab — Investment Command Center</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">🪄 <span>Miracolo Lab</span></div>
    <div class="brand-sub">Investment Command Center</div>
    <nav id="nav">
      <button class="nav active" data-tab="home">🏠 Dashboard</button>
      <button class="nav" data-tab="trading">🎯 Trading</button>
      <button class="nav" data-tab="portfolio">💼 Portafoglio</button>
      <button class="nav" data-tab="radar">🔎 Radar</button>
      <button class="nav" data-tab="news">📰 News</button>
      <button class="nav" data-tab="crypto">₿ Crypto</button>
      <button class="nav" data-tab="risk">⚠️ Black Swan</button>
      <button class="nav" data-tab="sim">🧪 Simulazioni</button>
      <button class="nav" data-tab="settings">⚙️ Impostazioni</button>
    </nav>
    <div class="side-note">Paper trading • Capitale iniziale €2.000</div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <div class="eyebrow">INVESTMENT LAB</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="top-actions">
        <span id="marketPill" class="pill">MERCATO: —</span>
        <button id="quickNews" class="primary">📰 Scansiona News</button>
      </div>
    </header>

    <section id="content"></section>
  </main>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
