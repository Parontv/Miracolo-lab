<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Miracolo Lab — Investment Radar</title>
<meta name="description" content="Investment Radar con news, social, indici globali, quotazioni, indicatori tecnici e strategia paper trading.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/readability.css">
<link rel="stylesheet" href="/accessibility.css">
<link rel="stylesheet" href="/charts.css">
<link rel="stylesheet" href="/market.css">
<link rel="stylesheet" href="/binance-ui.css">
<link rel="stylesheet" href="/recap-ui.css">
</head>
<body>
<div id="toast-container"></div>
<main class="app">
<header class="top"><div class="brand-wrap"><div class="brand"><span class="brand-icon">🪄</span> Miracolo Lab</div><div class="sub">Investment Radar · Market Intelligence · Paper Trading</div></div><div class="header-actions"><div class="auto-refresh-wrap"><label class="toggle-label" for="autoRefresh"><span class="toggle-text">Auto</span><div class="toggle-switch"><input type="checkbox" id="autoRefresh"><span class="toggle-slider"></span></div></label><span id="countdownDisplay" class="countdown-display"></span></div><button id="scan" class="primary"><span class="btn-icon">🔎</span><span class="btn-text">Scansiona</span></button></div></header>
<section class="stats" aria-label="Statistiche"><div class="card"><span class="card-label">STATO</span><b id="status" class="ok">PRONTO</b></div><div class="card"><span class="card-label">NEWS</span><b id="newsCount">—</b></div><div class="card"><span class="card-label">SOCIAL</span><b id="socialCount">—</b></div><div class="card"><span class="card-label">ULTIMO SCAN</span><b id="lastScan">—</b></div></section>
<nav class="tabs" role="tablist" aria-label="Sezioni radar"><button role="tab" data-filter="all" class="active" aria-selected="true">Tutti</button><button role="tab" data-filter="news" aria-selected="false">📰 News</button><button role="tab" data-filter="social" aria-selected="false">💬 Social</button><button role="tab" data-filter="strong" aria-selected="false">🔥 Forti</button><button role="tab" data-filter="analysis" aria-selected="false">📊 Analisi</button><button role="tab" data-filter="market" aria-selected="false" id="marketTab">🧠 Strategia</button></nav>
<section class="panel" aria-live="polite"><div class="panelHead"><div><h1 id="panelTitle">📡 Segnali rilevati</h1><p id="sourceInfo">Premi "Scansiona" per iniziare.</p></div></div><div id="sources"></div><div id="analysis" hidden></div><div id="market" hidden></div><div id="results"><div class="empty"><div class="empty-icon">📡</div><div>Il radar è pronto.<br><span>Premi Scansiona per iniziare</span></div></div></div></section>
</main>
<script src="/app.js"></script><script src="/market-ui.js"></script><script src="/binance-ui.js"></script><script src="/recap-ui.js"></script>
</body>
</html>
