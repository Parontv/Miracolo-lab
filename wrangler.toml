name = "miracolo-lab"
main = "bot-live-router.js"
account_id = "5637f51ea89c44719b4a680b6122bf05"
compatibility_date = "2026-08-27"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "ML_KV"
id = "aa163fd0c37a44bf8be0fbdc03a36316"

[vars]
BOT_MODE = "PAPER"
PAPER_AUTO_EXECUTION = "true"
PAPER_NOTIONAL = "100"
PAPER_MAX_BUYS_PER_DAY = "3"
PAPER_CRYPTO_ENABLED = "true"
HEARTBEAT_ENABLED = "true"
BOT_AUTO_WEIGHTS = "false"

[assets]
directory = "./public"
binding = "ASSETS"
