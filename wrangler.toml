name = "miracolo-lab"
main = "live-worker.js"
account_id = "5637f51ea89c44719b4a680b6122bf05"
compatibility_date = "2026-08-27"

[triggers]
crons = ["*/5 * * * *"]

[vars]
BOT_MODE = "PAPER"
PAPER_AUTO_EXECUTION = "true"
PAPER_NOTIONAL = "100"
PAPER_MAX_BUYS_PER_DAY = "3"
PAPER_MAX_POSITIONS = "3"
PAPER_MAX_EXPOSURE = "1800"
PAPER_COOLDOWN_MINUTES = "30"
PAPER_CRYPTO_ENABLED = "true"
HEARTBEAT_INTERVAL = "5m"
ALPACA_BASE_URL = "https://paper-api.alpaca.markets/v2"

[[kv_namespaces]]
binding = "ML_KV"

[assets]
directory = "./public"
binding = "ASSETS"
