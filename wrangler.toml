name = "miracolo-lab"
main = "live-worker.js"
compatibility_date = "2026-08-27"

[triggers]
crons = ["*/5 * * * *"]

[vars]
BOT_MODE = "PAPER"
HEARTBEAT_INTERVAL = "5m"

# V1 durable state: cursor, autonomous snapshot and API rate-limit counters.
# ML_KV must be bound to the existing Cloudflare KV namespace in the deployment environment.
[[kv_namespaces]]
binding = "ML_KV"

# Permanent historical memory: market photographs, AI analysis and daily news archives.

[assets]
directory = "./public"
binding = "ASSETS"
