name = "miracolo-lab"
main = "live-worker.js"
compatibility_date = "2026-08-27"

[triggers]
crons = ["*/5 * * * *"]

[vars]
BOT_MODE = "PAPER"
PAPER_AUTO_EXECUTION = "true"
PAPER_NOTIONAL = "100"
PAPER_MAX_BUYS_PER_DAY = "3"
PAPER_CRYPTO_ENABLED = "true"
HEARTBEAT_INTERVAL = "5m"
ALPACA_BASE_URL = "https://paper-api.alpaca.markets/v2"

[assets]
directory = "./public"
binding = "ASSETS"
