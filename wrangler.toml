name = "miracolo-lab"
main = "bot-live-router.js"
account_id = "5637f51ea89c44719b4a680b6122bf05"
compatibility_date = "2026-08-27"

[triggers]
crons = ["*/30 * * * *"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ML_KV"
id = "aa163fd0c37a44bf8be0fbdc03a36316"

[vars]
BOT_MODE = "PAPER"
PAPER_AUTO_EXECUTION = "true"
PAPER_NOTIONAL = "100"
PAPER_RISK_PER_TRADE_USD = "8"
PAPER_STOP_LOSS_PCT = "1.5"
PAPER_TAKE_PROFIT_PCT = "3"
PAPER_MAX_BUYS_PER_DAY = "3"
PAPER_MAX_TRADES_PER_DAY = "3"
PAPER_MAX_POSITIONS = "3"
PAPER_CRYPTO_ENABLED = "true"
HEARTBEAT_ENABLED = "true"
BOT_AUTO_WEIGHTS = "false"

[assets]
directory = "./public"
binding = "ASSETS"
