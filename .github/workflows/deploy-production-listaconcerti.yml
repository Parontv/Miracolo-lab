name: Production verification (manual)
on:
  workflow_dispatch:
concurrency:
  group: miracolo-lab-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          find scripts -type f -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
          node tests/news-contract.test.js
          node tests/market-ui.test.js
      - name: Verify current production
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'
          h={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'MiracoloLab-Manual-Verification/1.0'}
          def get(path):
              req=urllib.request.Request(base+path+('&' if '?' in path else '?')+'ts='+str(time.time_ns()),headers=h)
              return json.load(urllib.request.urlopen(req,timeout=45))
          v=get('/version'); print('VERSION:',json.dumps(v))
          health=get('/api/health'); print('HEALTH:',json.dumps(health))
          mm=get('/api/market-monitor'); print('QUANTITATIVE:',isinstance(mm.get('quantitative'),dict))
          ai=get('/api/ai'); print('AI:',json.dumps({k:ai.get(k) for k in ('status','model','generatedAt','build')}))
          chart=get('/api/chart?symbol=%5EGSPC&period=5d'); print('CHART_CANDLES:',len(chart.get('candles') or []))
          if not health.get('ok'): sys.exit('Production health failed')
          if not isinstance(mm.get('quantitative'),dict): sys.exit('Production quantitative payload missing')
          if not chart.get('ok') or len(chart.get('candles') or [])<2: sys.exit('Production chart failed')
          print('PRODUCTION VERIFICATION: PASS')
          PY
