name: Deploy Production Listaconcerti
on:
  workflow_dispatch:
concurrency:
  group: miracolo-lab-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source before deploy
        run: |
          node --check worker.js
          node --check ai-worker.js
          node --check public/v1/market.js
          node tests/news-contract.test.js
          node tests/market-ui.test.js
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5637f51ea89c44719b4a680b6122bf05
        run: npx wrangler@4 deploy --name miracolo-lab
      - name: Verify production Miracolo Lab
        run: |
          python - <<'PY'
          import urllib.request,sys,time,json
          base='https://miracolo-lab.listaconcerti.workers.dev'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              return urllib.request.urlopen(req,timeout=45).read().decode('utf-8','replace')
          html=get('/?ts='+str(time.time_ns()))
          if 'Miracolo Lab' not in html: sys.exit('Production HTML does not identify Miracolo Lab')
          print('PRODUCTION HTML: PASS')
          raw=get('/api/market-monitor')
          data=json.loads(raw)
          quant=data.get('quantitative')
          if not isinstance(quant,dict): sys.exit('API missing quantitative payload')
          coverage=quant.get('coverage',{})
          groups=quant.get('groups',{})
          if not isinstance(groups,dict): sys.exit('API missing quantitative groups')
          print('QUANTITATIVE API: PASS; coverage='+json.dumps(coverage))
          for name in ('macro','central','rates','credit'):
              if name not in groups: sys.exit('Missing quantitative group: '+name)
          print('QUANTITATIVE GROUPS: PASS')
          PY
