name: News Contract Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  news-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical news contract
        run: node tests/news-contract.test.js
