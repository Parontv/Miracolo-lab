name: Miracolo Lab — Fixed Deploy

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'public/**'
      - 'wrangler.toml'
      - 'tests/**'
      - '.github/workflows/deploy-miracolo-fixed.yml'
  workflow_dispatch:

concurrency:
  group: miracolo-lab-production-fixed
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical runtime
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/bot-engine.behavior.test.js
          node tests/crypto-paper.test.mjs
          node tests/market-ui.test.js
          node tests/news-contract.test.js
          node tests/bot-server-engine.test.mjs
          node tests/bot-risk-engine.test.mjs
          node -e "import('./bot-server-engine.js').then(m=>{if(typeof m.runBot!=='function'||typeof m.getBotDecision!=='function')throw new Error('Unified bot exports missing')})"
          node -e "import('./bot-paper-executor.js').then(m=>{if(typeof m.executePaperDecision!=='function')throw new Error('Paper executor missing')})"

      - name: Cloudflare authentication check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 whoami

      - name: Resolve ML_KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KV_ID="$(npx wrangler@4 kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);const rows=Array.isArray(x)?x:(x.result||[]);const n=rows.find(v=>v.title==='miracolo-lab-ML_KV'||v.title==='ML_KV');if(n)process.stdout.write(n.id)})")"
          if [ -z "$KV_ID" ]; then
            echo 'ML_KV namespace not found; creating it.'
            CREATE_OUT="$(npx wrangler@4 kv namespace create ML_KV)"
            echo "$CREATE_OUT"
            KV_ID="$(printf '%s\n' "$CREATE_OUT" | sed -n 's/.*id[[:space:]]*[=:][[:space:]]*["\x27]\{0,1\}\([0-9a-fA-F-]\{10,\}\)["\x27].*/\1/p' | head -n1)"
          fi
          test -n "$KV_ID"
          export KV_ID
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('wrangler.toml')
          s=p.read_text()
          kid=os.environ['KV_ID']
          blocks=list(re.finditer(r'(?ms)^\[\[kv_namespaces\]\]\s*\n.*?(?=^\[\[|^\[assets\]|\Z)',s))
          ml=[m for m in blocks if re.search(r'(?m)^binding\s*=\s*["\']ML_KV["\']',m.group(0))]
          if len(ml)>1: raise SystemExit('Duplicate ML_KV bindings in wrangler.toml')
          if len(ml)==1:
              block=ml[0].group(0)
              if re.search(r'(?m)^id\s*=',block):
                  block=re.sub(r'(?m)^id\s*=\s*["\'][^"\']+["\']',f'id = "{kid}"',block)
              else:
                  block=block.rstrip()+f'\nid = "{kid}"\n'
              s=s[:ml[0].start()]+block+s[ml[0].end():]
          else:
              marker='\n[assets]'
              insert=f'\n[[kv_namespaces]]\nbinding = "ML_KV"\nid = "{kid}"\n'
              s=s.replace(marker,insert+marker,1) if marker in s else s.rstrip()+insert+'\n'
          p.write_text(s)
          print('ML_KV BINDING: PASS')
          PY

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Verify production without placing orders
        env:
          WORKER_URL: ${{ secrets.MIRACOLO_WORKER_URL }}
        run: |
          set -euo pipefail
          test -n "$WORKER_URL"
          curl --fail --silent --show-error --max-time 30 "$WORKER_URL/api/alpaca/status"
