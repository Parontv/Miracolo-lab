name: Miracolo Lab — Fixed Deploy

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'public/**'
      - 'wrangler.toml'
      - 'tests/**'
      - '.github/workflows/deploy-miracolo-fixed.yml'
  workflow_dispatch:

concurrency:
  group: miracolo-lab-production-fixed
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical runtime
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/bot-engine.behavior.test.js
          node tests/crypto-paper.test.mjs
          node tests/market-ui.test.js
          node tests/news-contract.test.js
          node tests/bot-server-engine.test.mjs
          node tests/bot-risk-engine.test.mjs
          node -e "import('./bot-server-engine.js').then(m=>{if(typeof m.runBot!=='function'||typeof m.getBotDecision!=='function')throw new Error('Unified bot exports missing')})"
          node -e "import('./bot-paper-executor.js').then(m=>{if(typeof m.executePaperDecision!=='function')throw new Error('Paper executor missing')})"

      - name: Cloudflare authentication check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 whoami

      - name: Ensure stable ML_KV binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXISTING_KV_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          KV_ID="${EXISTING_KV_ID:-}"
          if [ -z "$KV_ID" ]; then
            KV_ID="$(npx wrangler@4 kv namespace list --json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);const a=Array.isArray(x)?x:(x.result||[]);const n=a.find(v=>v.title==='miracolo-lab-ml-kv');if(n?.id)process.stdout.write(n.id)})")"
          fi
          if [ -z "$KV_ID" ]; then
            echo 'ML_KV namespace not found; creating stable namespace miracolo-lab-ml-kv'
            KV_ID="$(npx wrangler@4 kv namespace create miracolo-lab-ml-kv --json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);const id=x.id||x.result?.id;if(!id)throw Error('KV namespace creation returned no id');process.stdout.write(id)})")"
          fi
          test -n "$KV_ID"
          export KV_ID
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('wrangler.toml')
          s=p.read_text()
          kid=os.environ['KV_ID']
          blocks=list(re.finditer(r'(?ms)^\[\[kv_namespaces\]\]\s*\n.*?(?=^\[\[|^\[assets\]|\Z)',s))
          ml=[m for m in blocks if re.search(r'(?m)^binding\s*=\s*["\']ML_KV["\']',m.group(0))]
          if len(ml)>1: raise SystemExit('Duplicate ML_KV bindings in wrangler.toml')
          if len(ml)==1:
              block=ml[0].group(0)
              if re.search(r'(?m)^id\s*=',block):
                  block=re.sub(r'(?m)^id\s*=\s*["\'][^"\']+["\']',f'id = "{kid}"',block)
              else:
                  block=block.rstrip()+f'\nid = "{kid}"\n'
              s=s[:ml[0].start()]+block+s[ml[0].end():]
          else:
              marker='\n[assets]'
              insert=f'\n[[kv_namespaces]]\nbinding = "ML_KV"\nid = "{kid}"\n'
              s=s.replace(marker,insert+marker,1) if marker in s else s.rstrip()+insert+'\n'
          p.write_text(s)
          print('ML_KV BINDING: PASS')
          PY

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml

      - name: Verify production without placing orders
        env:
          WORKER_URL: https://miracolo-lab.listaconcerti.workers.dev
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          base=os.environ['WORKER_URL'].rstrip('/')
          def call(path):
              req=urllib.request.Request(base+path+('?ts=' if '?' not in path else '&ts=')+str(time.time_ns()),headers={'Accept':'application/json','Cache-Control':'no-cache','Pragma':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try: data=json.loads(body)
                  except: data={'raw':body}
                  return e.code,data
          status_code,status=call('/api/alpaca/status')
          print('=== ALPACA STATUS ===')
          print(json.dumps(status,ensure_ascii=False,indent=2))
          if status_code!=200 or status.get('mode')!='PAPER': sys.exit('FAIL: Alpaca Paper non verificato')
          crypto_code,crypto=call('/api/bot/crypto')
          print('=== BTC ===')
          print(json.dumps(crypto,ensure_ascii=False,indent=2))
          if crypto_code!=200 or not crypto.get('ok') or crypto.get('symbol')!='BTC/USD': sys.exit('FAIL: BTC/USD non disponibile')
          plan_code,plan=call('/api/bot/plan')
          print('=== BOT PLAN ===')
          print(json.dumps(plan,ensure_ascii=False,indent=2))
          if plan_code!=200 or plan.get('mode')!='PAPER': sys.exit('FAIL: piano Bot non disponibile')
          execution=plan.get('execution') or {}
          if execution.get('dryRun') is not True: sys.exit('FAIL: il piano non è dry-run')
          action=(plan.get('botAction') or {}).get('action','HOLD')
          symbol=(plan.get('botAction') or {}).get('symbol')
          print(f'PLAN ACTION: {action} {symbol or ""}'.strip())
          print('RESULT: LIVE WORKER + PAPER PLAN VERIFIED; no order submitted by CI.')
          PY
