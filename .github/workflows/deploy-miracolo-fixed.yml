name: Miracolo Lab — Fixed Deploy

on:
  push:
    branches: [main, fix/bot-decision-live, fix/bot-ai-fred-live-20261029, fix/fred-proxy-fallback-20261029, feature/bot-evaluation-v1, feature/bot-evaluation-final, feature/bot-eval-live-verify]
    paths:
      - '*.js'
      - 'public/**'
      - 'wrangler.toml'
      - 'tests/**'
      - '.github/workflows/deploy-miracolo-fixed.yml'
  workflow_dispatch:

concurrency:
  group: miracolo-lab-production-fixed
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical runtime
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/bot-engine.behavior.test.js
          node tests/crypto-paper.test.mjs
          node tests/crypto-paper-engine.test.mjs
          node tests/hummingbot-adapter.test.mjs
          node tests/hummingbot-ui.test.mjs
          node tests/market-ui.test.js
          node tests/news-contract.test.js
          node tests/bot-server-engine.test.mjs
          node tests/bot-risk-engine.test.mjs
          node tests/bot-subrequest-contract.test.mjs
          node tests/bot-context-enrichment.test.mjs
          node tests/bot-macro-context.test.mjs
          node tests/bot-evaluation.test.mjs
          node -e "import('./bot-server-engine.js').then(m=>{if(typeof m.runBot!=='function'||typeof m.getBotDecision!=='function')throw new Error('Unified bot exports missing')})"
          node -e "import('./bot-paper-executor.js').then(m=>{if(typeof m.executePaperDecision!=='function')throw new Error('Paper executor missing')})"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare authentication check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 whoami
      - name: Validate fixed ML_KV binding
        run: |
          set -euo pipefail
          grep -A2 '^\[\[kv_namespaces\]\]' wrangler.toml | grep -q 'binding = "ML_KV"'
          grep -A2 '^\[\[kv_namespaces\]\]' wrangler.toml | grep -Eq 'id = "[0-9a-f]{32}"'
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 deploy --config wrangler.toml
      - name: Sync Gemini API key when configured in GitHub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          key="${GEMINI_API_KEY:-${GOOGLE_GEMINI_API_KEY:-}}"
          if [ -n "$key" ]; then
            printf '%s' "$key" | npx wrangler@4 secret put GEMINI_API_KEY --config wrangler.toml
            echo "Gemini secret synced to Cloudflare Worker (value hidden)."
          else
            echo "No Gemini key present in GitHub Actions secrets; existing Cloudflare secret left unchanged."
          fi
      - name: Verify production without placing orders
        env:
          WORKER_URL: https://miracolo-lab.listaconcerti.workers.dev
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          base=os.environ['WORKER_URL'].rstrip('/')
          def call(path):
              url=base+path+('?ts=' if '?' not in path else '&ts=')+str(time.time_ns())
              req=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try:data=json.loads(body)
                  except:data={'raw':body}
                  return e.code,data
          status_code,status=call('/api/alpaca/status')
          print('=== ALPACA STATUS ===');print(json.dumps(status,ensure_ascii=False,indent=2))
          if status_code!=200 or status.get('mode')!='PAPER':sys.exit('FAIL: Alpaca Paper non verificato')
          crypto_paper_code,crypto_paper=call('/api/crypto-bot/status')
          for attempt in range(18):
            if crypto_paper_code==200 and crypto_paper.get('mode')=='PAPER' and crypto_paper.get('market')=='CRYPTO_24_7' and (crypto_paper.get('state') or {}).get('cycles',0)>=1 and crypto_paper.get('heartbeat',{}).get('ok') is True:
              break
            time.sleep(5)
            crypto_paper_code,crypto_paper=call('/api/crypto-bot/status')
          crypto_state=crypto_paper.get('state') or {}
          crypto_cycle=crypto_state.get('lastCycle') or {}
          crypto_signals=crypto_cycle.get('signals') or []
          crypto_signal_summary=[{'symbol':x.get('symbol'),'action':x.get('action'),'provider':x.get('provider'),'independentVotes':x.get('independentVotes'),'agreement':x.get('agreement'),'score':x.get('score'),'reason':x.get('reason')} for x in crypto_signals]
          print('=== INDEPENDENT CRYPTO PAPER BOT ===');print(json.dumps({'http':crypto_paper_code,'mode':crypto_paper.get('mode'),'market':crypto_paper.get('market'),'cycles':crypto_state.get('cycles'),'contextAvailable':crypto_cycle.get('contextAvailable'),'contextSource':crypto_cycle.get('contextSource'),'available':crypto_cycle.get('available'),'total':crypto_cycle.get('total'),'signals':crypto_signal_summary,'heartbeat':crypto_paper.get('heartbeat')},ensure_ascii=False,indent=2))
          if crypto_paper_code!=200 or crypto_paper.get('mode')!='PAPER' or crypto_paper.get('market')!='CRYPTO_24_7' or crypto_state.get('cycles',0)<1 or crypto_paper.get('heartbeat',{}).get('ok') is not True:sys.exit('FAIL: crypto cron non ha completato un ciclo PAPER verificato entro 90 secondi')
          if crypto_cycle.get('contextAvailable') is not True:sys.exit('FAIL: crypto cycle senza consenso condiviso Miracolo')
          if crypto_cycle.get('available')!=5 or crypto_cycle.get('total')!=5:sys.exit('FAIL: copertura Crypto non completa 5/5')
          if len(crypto_signals)!=5 or any(int(x.get('independentVotes') or 0)<3 for x in crypto_signals):sys.exit('FAIL: consenso multi-fonte crypto incompleto: servono almeno 3 voti per ciascun asset')
          crypto_code,crypto=call('/api/bot/crypto')
          print('=== BTC ===');print(json.dumps(crypto,ensure_ascii=False,indent=2))
          if crypto_code!=200 or not crypto.get('ok') or crypto.get('symbol')!='BTC/USD':sys.exit('FAIL: BTC/USD non disponibile')
          # Strategy Lab uses these eight instruments for its technical, historical and backtest modules.
          strategy_symbols=['^GSPC','^NDX','^DJI','^RUT','^GDAXI','^FCHI','FTSEMIB.MI','^STOXX50E']
          strategy_history={}
          for symbol in strategy_symbols:
            from urllib.parse import quote
            code,data=call('/api/chart?symbol='+quote(symbol,safe='')+'&period=3m')
            count=len(data.get('candles') or [])
            strategy_history[symbol]={'http':code,'ok':data.get('ok'),'candles':count,'source':data.get('source')}
            if code!=200 or not data.get('ok') or count<30:
              sys.exit('FAIL: storico Strategy Lab insufficiente per '+symbol+': '+json.dumps(strategy_history[symbol]))
          print('=== STRATEGY LAB HISTORY ===')
          print(json.dumps(strategy_history,ensure_ascii=False,indent=2))

          # Verify the three live data contracts consumed by Strategy Lab. Keep the endpoints
          # read-only and tolerate a legitimately empty rotating-universe candidate batch.
          bot_code,bot_data=call('/api/bot-monitor')
          if bot_code!=200 or not isinstance(bot_data.get('candidates'),list):
            sys.exit('FAIL: Strategy Lab bot-monitor contract unavailable')
          market_code,market_data=call('/api/market-monitor')
          market_rows=market_data.get('indices') or []
          if market_code!=200 or not isinstance(market_rows,list) or not market_rows:
            sys.exit('FAIL: Strategy Lab market-monitor contract unavailable')
          ai_code,ai_data=call('/api/ai')
          if ai_code!=200 or not ai_data.get('ok') or not isinstance(ai_data.get('ai'),dict):
            sys.exit('FAIL: Strategy Lab AI contract unavailable')
          print('=== STRATEGY LAB DATA CONTRACTS ===')
          print(json.dumps({
            'botMonitor':{'http':bot_code,'candidates':len(bot_data.get('candidates') or []),'universe':bot_data.get('universeCount')},
            'marketMonitor':{'http':market_code,'indices':len(market_rows),'valid':sum(1 for x in market_rows if x.get('ok') and isinstance(x.get('price'),(int,float)))},
            'ai':{'http':ai_code,'status':(ai_data.get('ai') or {}).get('status'),'provider':(ai_data.get('ai') or {}).get('provider')}
          },ensure_ascii=False,indent=2))
          plan_code,plan=call('/api/bot/plan')
          print('=== BOT PLAN ===');print(json.dumps(plan,ensure_ascii=False,indent=2))
          if plan_code!=200 or plan.get('mode')!='PAPER':sys.exit('FAIL: piano Bot non disponibile')
          if not plan.get('ok'):sys.exit('FAIL: Bot engine returned NO_DATA/ERROR')
          research_keys=['researchCouncil','researchAdapters','vibeTradingResearch','freqtradeBacktest','llmTradingLab','dayTraderSkill','dailyStockAnalysis','aiHedgeFundResearch']
          missing_research=[k for k in research_keys if k not in plan]
          if missing_research:sys.exit('FAIL: research sidecars missing from /api/bot/plan: '+', '.join(missing_research))
          print('RESEARCH SIDECARS:', ', '.join(research_keys))
          modules=plan.get('modules') or []
          if len(modules)!=11:sys.exit(f'FAIL: expected 11 Bot modules, got {len(modules)}')
          execution=plan.get('execution') or {}
          if execution.get('dryRun') is not True:sys.exit('FAIL: il piano non è dry-run')
          action=(plan.get('botAction') or {}).get('action','HOLD')
          symbol=(plan.get('botAction') or {}).get('symbol')
          print(f'PLAN ACTION: {action} {symbol or ""}'.strip())
          print('MODULES:', ', '.join(f"{m.get('family')}={m.get('status')}" for m in modules))
          flow_code,orderflow=call('/api/bot/order-flow')
          print('=== ORDER FLOW ===');print(json.dumps(orderflow,ensure_ascii=False,indent=2))
          if flow_code!=200 or orderflow.get('mode')!='READ_ONLY' or orderflow.get('executionEnabled') is not False:
              sys.exit('FAIL: Order Flow diagnostic is not read-only or unavailable')
          if orderflow.get('status')!='ok':
              print('WARNING: Binance order flow feed unavailable/incomplete; flow module must remain NO_DATA.')
          else:
              print('ORDER FLOW:', orderflow.get('provider'), orderflow.get('instrumentCount'), '/', orderflow.get('expectedInstruments'))

          decision_code,decision=call('/api/bot/decision')
          print('=== BOT DECISION ENDPOINT ===');print(json.dumps(decision,ensure_ascii=False,indent=2))
          if decision_code!=200 or not decision.get('ok') or decision.get('mode')!='PAPER':
              sys.exit('FAIL: /api/bot/decision non disponibile o non PAPER')
          missing_research=[k for k in research_keys if k not in decision]
          if missing_research:sys.exit('FAIL: research sidecars missing from /api/bot/decision: '+', '.join(missing_research))
          decision_modules=decision.get('modules') or []
          if len(decision_modules)!=11:
              sys.exit(f'FAIL: /api/bot/decision expected 11 modules, got {len(decision_modules)}')
          decision_core=decision.get('decision') or {}
          if not all(k in decision_core for k in ('direction','confidence','dataCoverage','agreement')):
              sys.exit('FAIL: /api/bot/decision contract incompleto')
          fred_code,fred=call('/api/bot/fred-diagnostic')
          print('=== FRED DIAGNOSTIC ===');print(json.dumps(fred,ensure_ascii=False,indent=2))
          if fred_code!=200 or not fred.get('ok'):
              print('WARNING: FRED diagnostic non riuscita; deploy non bloccato per indisponibilità del provider.')
          elif not (fred.get('coverage') or {}).get('available',0):
              print('WARNING: FRED non restituisce osservazioni numeriche; controllare errors/seriesErrors.')
          ai_diag_code,ai_diag=call('/api/ai/diagnostic')
          print('=== AI DIAGNOSTIC ===');print(json.dumps(ai_diag,ensure_ascii=False,indent=2))
          if ai_diag_code!=200 or not ai_diag.get('ok'): print('WARNING: AI diagnostic endpoint unavailable')
          if not ai_diag.get('keyConfigured') and not ai_diag.get('cloudflareAiConfigured'): print('WARNING: no Gemini key and no Cloudflare Workers AI binding configured')
          if ai_diag.get('status') not in ('ok','cached'): print('WARNING: AI analysis is not live; inspect provider/status/fallbackReason/lastError')
          ai_code,ai=call('/api/ai')
          print('=== AI STATUS ===');print(json.dumps(ai,ensure_ascii=False,indent=2))
          eval_code,report=call('/api/bot/eval')
          print('=== BOT EVAL ===');print(json.dumps(report,ensure_ascii=False,indent=2))
          if eval_code!=200 or not report.get('ok'):sys.exit('FAIL: /api/bot/eval non disponibile')
          print('RESULT: LIVE WORKER + PAPER PLAN + BOT EVAL VERIFIED; no order submitted by CI.')
          PY
