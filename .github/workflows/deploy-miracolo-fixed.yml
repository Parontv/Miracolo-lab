name: Miracolo Lab — Fixed Deploy

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'public/**'
      - 'wrangler.toml'
      - 'tests/**'
      - '.github/workflows/deploy-miracolo-fixed.yml'
  workflow_dispatch:

concurrency:
  group: miracolo-lab-production-fixed
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/bot-v10.test.mjs
          node tests/bot-v11.test.mjs
          node tests/crypto-paper.test.mjs
          node tests/market-ui.test.js
          node -e "import('./bot-server-engine-v15.js').then(m=>{if(typeof m.runBot!=='function'||typeof m.getBotDecision!=='function')throw new Error('V15 exports missing')})"
          node -e "import('./bot-paper-executor-v1.js').then(m=>{if(typeof m.executePaperDecision!=='function')throw new Error('Paper executor missing')})"

      - name: Resolve ML_KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 5637f51ea89c44719b4a680b6122bf05
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces"
          LIST="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$API")"
          KV_ID="$(printf '%s' "$LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(!x.success)throw Error(JSON.stringify(x.errors));const n=(x.result||[]).find(v=>v.title==='miracolo-lab-ML_KV'||v.title==='ML_KV');if(n)process.stdout.write(n.id)})")"
          if [ -z "$KV_ID" ]; then
            CREATED="$(curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data '{"title":"miracolo-lab-ML_KV"}' "$API")"
            KV_ID="$(printf '%s' "$CREATED" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(!x.success)throw Error(JSON.stringify(x.errors));process.stdout.write(x.result.id)})")"
          fi
          test -n "$KV_ID"
          node -e "const fs=require('fs');let s=fs.readFileSync('wrangler.toml','utf8');s=s.replace(/binding = \"ML_KV\"\\n(?:id = .*\\n)?/,'binding = \"ML_KV\"\\nid = \"${KV_ID}\"\\n');fs.writeFileSync('wrangler.deploy.toml',s)"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5637f51ea89c44719b4a680b6122bf05
          command: deploy --config wrangler.deploy.toml

      - name: Verify production
        run: |
          python - <<'PY'
          import json, urllib.request, time, sys
          base='https://miracolo-lab.listaconcerti.workers.dev'
          def get(path):
              req=urllib.request.Request(base+path+('?ts=' if '?' not in path else '&ts=')+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          s=get('/api/alpaca/status'); print('ALPACA',s.get('mode'),s.get('base'))
          if not s.get('ok') or s.get('mode')!='PAPER':sys.exit('Alpaca Paper verification failed')
          c=get('/api/bot/crypto'); print('CRYPTO',c.get('symbol'),c.get('status'))
          if not c.get('ok') or c.get('symbol')!='BTC/USD':sys.exit('BTC verification failed')
          b=get('/api/bot/decision'); print('BOT',b.get('version'),b.get('status'))
          if not b.get('ok'):sys.exit('Bot verification failed')
          print('PRODUCTION VERIFICATION: PASS')
          PY
