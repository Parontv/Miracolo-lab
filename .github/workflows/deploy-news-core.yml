name: Deploy Miracolo Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miracolo-lab-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check JavaScript
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Compile Python scripts
        run: |
          set -e
          find scripts -type f -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
      - name: News contract test
        run: node tests/news-contract.test.js
      - name: Market/UI integrity test
        run: node tests/market-ui.test.js
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Ensure ML_KV binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KV_ID=$(npx wrangler@4 kv namespace list | jq -r '.[] | select(.title | endswith("ML_KV")) | .id' | head -n1 || true)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo 'ML_KV namespace not found; creating it without --update-config.'
            CREATE_OUT=$(npx wrangler@4 kv namespace create ML_KV 2>&1)
            echo "$CREATE_OUT"
            KV_ID=$(printf '%s\n' "$CREATE_OUT" | grep -Eo '[0-9a-fA-F]{32}' | head -n1 || true)
          fi
          test -n "$KV_ID" && test "$KV_ID" != null
          export KV_ID
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('wrangler.toml'); s=p.read_text(); kid=os.environ['KV_ID']
          blocks=list(re.finditer(r'(?ms)^\[\[kv_namespaces\]\]\s*\n.*?(?=^\[\[|^\[assets\]|\Z)',s))
          ml=[]
          for m in blocks:
              if re.search(r'(?m)^binding\s*=\s*["\']ML_KV["\']',m.group(0)): ml.append(m)
          if len(ml)>1: raise SystemExit('Duplicate ML_KV bindings in wrangler.toml')
          if len(ml)==1:
              block=ml[0].group(0)
              if re.search(r'(?m)^id\s*=',block): block=re.sub(r'(?m)^id\s*=\s*["\'][^"\']+["\']',f'id = "{kid}"',block)
              else: block=block.rstrip()+f'\nid = "{kid}"\n'
              s=s[:ml[0].start()]+block+s[ml[0].end():]
          else:
              marker='\n[assets]'; insert=f'\n[[kv_namespaces]]\nbinding = "ML_KV"\nid = "{kid}"\n'
              if marker in s: s=s.replace(marker,insert+marker,1)
              else: s=s.rstrip()+insert+'\n'
          p.write_text(s); print('ML_KV BINDING: PASS',kid)
          PY
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
      - name: Verify production endpoints and UI
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'
          h={'User-Agent':'MiracoloLab-Deployment-Verification/1.0','Cache-Control':'no-cache'}
          def get(path):
              u=base+path+('&' if '?' in path else '?')+'ts='+str(time.time_ns())
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=45))
          v=get('/version'); print('VERSION',json.dumps(v))
          if not v.get('ok'): sys.exit('version failed')
          health=get('/api/health'); print('HEALTH',json.dumps(health))
          if not health.get('ok'): sys.exit('health failed')
          live=get('/api/live'); print('LIVE_BYTES',len(json.dumps(live)))
          if 'universe' in live and isinstance(live['universe'],dict) and 'tickers' in live['universe']: sys.exit('live payload still contains full universe tickers')
          mm=get('/api/market-monitor'); print('MARKET_MONITOR_QUANTITATIVE', 'quantitative' in mm)
          if 'quantitative' not in mm: sys.exit('quantitative missing from market monitor')
          ai=get('/api/ai'); print('AI_STATUS',ai.get('status'),ai.get('generatedAt'))
          chart=get('/api/chart?symbol=%5EGSPC&period=5d'); print('CHART_CANDLES',len(chart.get('candles') or []))
          if not chart.get('ok') or len(chart.get('candles') or [])<2: sys.exit('chart failed')
          html=urllib.request.urlopen(urllib.request.Request(base+'/',headers=h),timeout=30).read().decode('utf-8','replace')
          required=['data.js?v=1.4.1','dashboard.js?v=1.5.4','strategy-lab.js?v=2.3.2','market.js?v=1.0.0','trading-agents.js?v=1.0.3','trading-agents.css?v=1.0.3','tab-navigation.js?v=1.6.4']
          for marker in required:
              if marker not in html: sys.exit('UI missing '+marker)
          for marker in ['trading-desk.js','trading-desk.css']:
              if marker in html: sys.exit('legacy trading desk still referenced')
          print('UI ENTRYPOINTS: PASS')
          PY
