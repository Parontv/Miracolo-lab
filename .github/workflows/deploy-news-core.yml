name: Deploy Miracolo Lab News Core
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miracolo-lab-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build persistent batched News Core
        run: python scripts/build-news-core.py
      - name: Expand market universe
        run: python scripts/patch-market-universe.py
      - name: Expand institutional and macro source universe
        run: python scripts/patch-source-universe.py
      - name: Add structured institutional data
        run: python scripts/patch-institutional-data.py
      - name: Add retail social sentiment
        run: python scripts/patch-social-data.py
      - name: Add crypto onchain data
        run: python scripts/patch-onchain-data.py
      - name: Enforce Workers Free data budget
        run: python scripts/patch-free-budget.py
      - name: Add Market chart endpoint
        run: python scripts/patch-market-chart.py
      - name: Harden crypto price fallbacks
        run: python scripts/patch-crypto-reliability.py
      - name: Stabilize News Core live endpoint
        run: python scripts/patch-news-live.py
      - name: Patch dashboard market rendering
        run: python scripts/patch-dashboard-indices.py
      - name: Reapply Market chart route after final Worker generation
        run: python scripts/patch-market-chart.py
      - name: Restore static ASSETS route after generated Worker patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text(); old="}}return new Response('Not found',{status:404})}};"; new="}}if(u.pathname==='/'&&env.ASSETS)return env.ASSETS.fetch(new Request(new URL('/index.html',req.url),req));if(env.ASSETS)return env.ASSETS.fetch(req);return new Response('Not found',{status:404})}};"
          if old not in s and "if(env.ASSETS)return env.ASSETS.fetch(req)" not in s: raise SystemExit('Generated Worker route tail not found')
          if old in s: p.write_text(s.replace(old,new))
          print('STATIC ASSETS ROUTE: PASS')
          PY
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Ensure ML_KV namespace and binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5637f51ea89c44719b4a680b6122bf05
        run: |
          set -e
          KV_ID=$(npx wrangler@4 kv namespace list | jq -r '.[] | select(.title | endswith("ML_KV")) | .id' | head -n1)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo 'ML_KV namespace not found; creating it.'
            npx wrangler@4 kv namespace create ML_KV --update-config --binding ML_KV
            KV_ID=$(grep -oE 'id = "[a-f0-9]+"' wrangler.toml | head -n1 | cut -d'"' -f2)
          fi
          if [ -z "$KV_ID" ]; then echo 'Unable to resolve ML_KV namespace id'; exit 1; fi
          export KV_ID
          python - <<'PY'
          from pathlib import Path
          import re,os
          p=Path('wrangler.toml'); s=p.read_text(); kid=os.environ['KV_ID']
          pattern=r'(?m)(\[\[kv_namespaces\]\]\s*\nbinding = "ML_KV"\s*\nid = )"[^"]+"'
          if re.search(pattern,s): s=re.sub(pattern,r'\1"'+kid+'"',s,count=1)
          else: s += '\n[[kv_namespaces]]\nbinding = "ML_KV"\nid = "'+kid+'"\n'
          p.write_text(s); print('ML_KV BINDING: PASS',kid)
          PY
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5637f51ea89c44719b4a680b6122bf05
        run: npx wrangler@4 deploy
      - name: Verify deployed build, full market universe and UI
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'; expected='ML-20260910-DATA-EXPANSION-V1'
          def get(path):
              nonce=str(time.time_ns()); return json.load(urllib.request.urlopen(urllib.request.Request(base+path+('?ts='+nonce if '?' not in path else '&ts='+nonce),headers={'User-Agent':'MiracoloLab-Deployment-Verification/10.0','Cache-Control':'no-cache','Pragma':'no-cache'}),timeout=60))
          version=None
          for attempt in range(10):
              try:
                  version=get('/version'); print('VERSION CHECK',attempt+1,version.get('build'))
                  if version.get('build')==expected: break
              except Exception as e: print('VERSION RETRY',attempt+1,str(e))
              time.sleep(3)
          if not version or version.get('build')!=expected: sys.exit('Deployed Worker build stamp is not DATA-EXPANSION-V1 after propagation window')
          health=get('/api/health')
          if not health.get('ok'): sys.exit('Health endpoint failed')
          market=get('/api/market-monitor'); indices=market.get('indices') or []
          if len(indices)<3: sys.exit('Market monitor returned fewer than 3 indices')
          names=' '.join(str(x.get('name','')) for x in indices)
          if 'S&P' not in names and 'SP500' not in names: sys.exit('S&P 500 missing from market monitor')
          prices=get('/api/prices?symbols=GOLD,SWDA,XMME'); crypto=get('/api/crypto')
          pmap={str(x.get('symbol','')).upper():x for x in prices.get('prices') or []}; cmap={str(x.get('symbol','')).upper():x for x in crypto.get('coins') or []}
          if not pmap.get('GOLD',{}).get('ok'): sys.exit('Portfolio GOLD price unavailable after deployment')
          if not cmap.get('BTC',{}).get('ok') or not cmap.get('ETH',{}).get('ok'): sys.exit('Portfolio crypto prices unavailable after deployment')
          if float(pmap['GOLD'].get('price') or 0)<=0 or float(cmap['BTC'].get('price') or 0)<=0 or float(cmap['ETH'].get('price') or 0)<=0: sys.exit('Portfolio price payload contains invalid zero values')
          nonce=str(time.time_ns()); html=urllib.request.urlopen(urllib.request.Request(base+'/?ts='+nonce,headers={'User-Agent':'MiracoloLab-UI-Verification/6.0','Cache-Control':'no-cache','Pragma':'no-cache'}),timeout=30).read().decode('utf-8','replace')
          for marker,msg in [('data.js?v=1.4.1','hardened data.js'),('dashboard.js?v=1.5.4','dashboard.js'),('news-feed-bridge.js?v=1.0.0','News Feed bridge'),('strategy-lab.js?v=2.3.2','Strategy Lab'),('market.js?v=1.0.0','Market tab'),('investment-charts.js?v=1.0.1','Investment charts'),('lightweight-charts@5.2.1','Lightweight Charts'),('trading-desk.js?v=1.0.1','Trading Desk'),('trading-desk.css?v=1.0.1','Trading Desk CSS'),('tab-navigation.js?v=1.6.3','navigation'),('Miracolo Lab','header')]:
              if marker not in html: sys.exit('Deployed UI missing '+msg)
          if 'sl2-submenu' in html: sys.exit('Deployed HTML still contains legacy Strategy Lab submenu markup')
          print('MARKET MONITOR: PASS',len(indices),'indices'); print('PORTFOLIO GOLD PRICE: PASS',pmap['GOLD'].get('price')); print('PORTFOLIO BTC PRICE: PASS',cmap['BTC'].get('price')); print('PORTFOLIO ETH PRICE: PASS',cmap['ETH'].get('price'))
          mem=get('/api/memory/recent')
          if not mem.get('ok'): sys.exit('Historical memory endpoint failed')
          print('MEMORY API: PASS',mem.get('date'),mem.get('count'))
          chart=json.load(urllib.request.urlopen(urllib.request.Request(base+'/api/chart?symbol=%5EGSPC&period=5d',headers={'User-Agent':'MiracoloLab-Chart-Verification/2.0','Cache-Control':'no-cache'}),timeout=30))
          if not chart.get('ok') or len(chart.get('candles') or [])<2: sys.exit('Market chart endpoint failed')
          print('MARKET CHART API: PASS',len(chart.get('candles') or []),'candles'); print('DEPLOYED UI ENTRYPOINTS: PASS'); print('LEGACY STRATEGY SUBMENU: ABSENT')
          PY
      - name: Verify News Core after deployment
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'; h={'User-Agent':'MiracoloLab-NewsCore-Verification/13.0','Cache-Control':'no-cache'}
          cats=['news','finance','crypto','macro','rates','central','commodities','fx','volatility','geopolitics','social','company']
          def get_live():
              raw=json.load(urllib.request.urlopen(urllib.request.Request(base+'/api/live?ts='+str(time.time_ns()),headers=h),timeout=30)); live=raw.get('news') or raw; cs=live.get('categorySummary') or {}; return live,{k:int((cs.get(k) or {}).get('count') or 0) for k in cats}
          samples=[]
          for attempt in range(6):
              try:
                  live,counts=get_live(); total=len(live.get('items') or []); print('LIVE CHECK',attempt+1,'ITEMS',total,'CATEGORIES',json.dumps(counts))
                  if total>=100 and sum(x==0 for x in counts.values())<=4:
                      samples.append((total,counts))
                      if len(samples)>=2 and samples[-1]==samples[-2]: print('NEWS CORE LIVE VERIFIED: stable snapshot and category counts'); break
              except Exception as e: print('LIVE RETRY',attempt+1,str(e))
              time.sleep(3)
          else: sys.exit('LIVE snapshot did not provide a stable valid News Core state')
          PY
