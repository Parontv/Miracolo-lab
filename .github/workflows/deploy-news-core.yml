name: Deploy Miracolo Lab News Core
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miracolo-lab-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build persistent batched News Core
        run: python scripts/build-news-core.py
      - name: Expand market universe
        run: python scripts/patch-market-universe.py
      - name: Add structured institutional data
        run: python scripts/patch-institutional-data.py
      - name: Add retail social sentiment
        run: python scripts/patch-social-data.py
      - name: Add crypto onchain data
        run: python scripts/patch-onchain-data.py
      - name: Stabilize News Core live endpoint
        run: python scripts/patch-news-live.py
      - name: Validate generated Worker syntax and data adapters
        run: |
          node --check worker.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text()
          if re.search(r'(?<!async )\bfunction botMonitor\s*\(', s):
              raise SystemExit('botMonitor must remain async')
          if re.search(r'(?<![A-Za-z0-9_])market\(\)', s):
              raise SystemExit('Unbound market() call remains; all routes must use market(env)')
          for marker in ["SECTOR_TECH:'XLK'","US3M:'^IRX'","USDBRL:'BRL=X'","async function institutionalData","async function socialData","async function onchainData","institutionalData:institutional","socialData:social","onchainData:onchain"]:
              if marker not in s: raise SystemExit('Missing generated worker marker: '+marker)
          if "const BUILD='ML-20260910-DATA-EXPANSION-V1';" not in s:
              raise SystemExit('Missing DATA-EXPANSION-V1 build stamp')
          print('WORKER SYNTAX: PASS')
          print('botMonitor async invariant: PASS')
          print('market(env) call-site invariant: PASS')
          print('DATA ADAPTER MARKERS: PASS')
          PY
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5637f51ea89c44719b4a680b6122bf05
          command: deploy
      - name: Verify deployed build and market data
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'
          nonce=str(time.time_ns())
          def get(path):
              return json.load(urllib.request.urlopen(urllib.request.Request(base+path+('?ts='+nonce if '?' not in path else '&ts='+nonce),headers={'User-Agent':'MiracoloLab-Deployment-Verification/2.0','Cache-Control':'no-cache'}),timeout=60))
          version=get('/version')
          print('DEPLOYED BUILD:',version.get('build'))
          if version.get('build')!='ML-20260910-DATA-EXPANSION-V1': sys.exit('Deployed Worker build stamp is not the expanded data build')
          raw=get('/api/market-monitor')
          indices=raw.get('indices') or []
          inst=raw.get('institutionalData') or {}
          social=raw.get('socialData') or {}
          onchain=raw.get('onchainData') or {}
          print('MARKET CHECK: indices=',len(indices),'institutional=',bool(inst),'social=',bool(social),'onchain=',bool(onchain))
          if len(indices)<35: sys.exit('Expanded market universe did not return enough instruments')
          if not isinstance(inst,dict) or not isinstance(social,dict) or not isinstance(onchain,dict): sys.exit('Structured adapters missing')
          print('MARKET/INSTITUTIONAL/SOCIAL/ONCHAIN VERIFIED')
          PY
      - name: Verify News Core after deployment
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'
          h={'User-Agent':'MiracoloLab-NewsCore-Verification/9.0','Cache-Control':'no-cache'}
          cats=['news','finance','crypto','macro','rates','central','commodities','fx','volatility','geopolitics','social','company']
          def get_live():
              nonce=str(time.time_ns())
              raw=json.load(urllib.request.urlopen(urllib.request.Request(base+'/api/live?ts='+nonce,headers=h),timeout=30))
              live=raw.get('news') or raw
              cs=live.get('categorySummary') or {}
              counts={k:int((cs.get(k) or {}).get('count') or 0) for k in cats}
              return live,counts
          samples=[]
          for attempt in range(6):
              try:
                  live,counts=get_live()
                  total=len(live.get('items') or [])
                  print('LIVE CHECK',attempt+1,'ITEMS',total,'CATEGORIES',json.dumps(counts))
                  if total>=100 and sum(x==0 for x in counts.values())<=4:
                      samples.append((total,counts))
                      if len(samples)>=2 and samples[-1]==samples[-2]:
                          print('NEWS CORE LIVE VERIFIED: stable snapshot and category counts')
                          break
              except Exception as e:
                  print('LIVE RETRY',attempt+1,str(e))
              time.sleep(3)
          else:
              sys.exit('LIVE snapshot did not provide a stable valid News Core state')
          PY
