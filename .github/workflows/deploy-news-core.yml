name: Deploy Miracolo Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miracolo-lab-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check JavaScript
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Compile Python scripts
        run: |
          set -e
          find scripts -type f -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
      - name: News contract test
        run: node tests/news-contract.test.js
      - name: Market/UI integrity test
        run: node tests/market-ui.test.js
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
      - name: Verify production endpoints and UI
        run: |
          set -e
          python - <<'PY'
          import json,urllib.request,sys,time,traceback
          base='https://miracolo-lab.listaconcerti.workers.dev'
          h={'User-Agent':'MiracoloLab-Deployment-Verification/1.0','Cache-Control':'no-cache'}
          report=[]; failed=False
          def get(name,path):
              global failed
              try:
                  u=base+path+('&' if '?' in path else '?')+'ts='+str(time.time_ns())
                  data=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=45))
                  report.append({'name':name,'path':path,'ok':True,'data':data})
                  print(name,json.dumps(data)[:6000])
                  return data
              except Exception as e:
                  failed=True; report.append({'name':name,'path':path,'ok':False,'error':repr(e)}); print(name,'ERROR',repr(e)); return None
          v=get('VERSION','/version')
          if not v or not v.get('ok'): failed=True
          health=get('HEALTH','/api/health')
          if not health or not health.get('ok'): failed=True
          live=get('LIVE','/api/live')
          if live and isinstance(live.get('universe'),dict) and 'tickers' in live['universe']: failed=True; print('LIVE_PAYLOAD_TOO_LARGE: universe.tickers present')
          mm=get('MARKET_MONITOR','/api/market-monitor')
          if not mm or 'quantitative' not in mm: failed=True; print('MARKET_MONITOR_QUANTITATIVE: MISSING')
          ai=get('AI','/api/ai')
          chart=get('CHART','/api/chart?symbol=%5EGSPC&period=5d')
          if not chart or not chart.get('ok') or len(chart.get('candles') or [])<2: failed=True
          try:
              req=urllib.request.Request(base+'/',headers=h); html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
              required=['data.js?v=1.4.1','dashboard.js?v=1.5.4','strategy-lab.js?v=2.3.2','market.js?v=1.0.0','trading-agents.js?v=1.0.3','trading-agents.css?v=1.0.3','tab-navigation.js?v=1.6.4']
              missing=[x for x in required if x not in html]; legacy=[x for x in ['trading-desk.js','trading-desk.css'] if x in html]
              report.append({'name':'UI','ok':not missing and not legacy,'missing':missing,'legacy':legacy}); print('UI',json.dumps({'missing':missing,'legacy':legacy}))
              if missing or legacy: failed=True
          except Exception as e:
              failed=True; report.append({'name':'UI','ok':False,'error':repr(e)}); print('UI ERROR',repr(e))
          open('/tmp/production-verification.json','w').write(json.dumps(report,indent=2,default=str))
          if failed: sys.exit('production verification failed; see artifact production-verification')
          print('PRODUCTION VERIFICATION: PASS')
          PY
      - name: Upload production verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: /tmp/production-verification.json
          if-no-files-found: ignore
