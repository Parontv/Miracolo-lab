name: Deploy Miracolo Lab News Core
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miracolo-lab-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build batched persistent News Core
        run: python scripts/build-news-core.py
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5637f51ea89c44719b4a680b6122bf05
          command: deploy
      - name: Warm and verify all News Core batches
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'
          h={'User-Agent':'MiracoloLab-NewsCore-Verification/5.0'}
          def get(p): return json.load(urllib.request.urlopen(urllib.request.Request(base+p,headers=h),timeout=90))
          cats=['news','finance','crypto','macro','rates','central','commodities','fx','volatility','geopolitics','social','company']
          for i in range(4):
              n=get('/api/full-scan')
              cs=n.get('categorySummary') or {}
              counts={k:int((cs.get(k) or {}).get('count') or 0) for k in cats}
              print('BATCH',i+1,'ITEMS',len(n.get('items') or []),'CATEGORIES',json.dumps(counts))
              time.sleep(1)
          n=get('/api/live')
          n=n.get('news') or n
          cs=n.get('categorySummary') or {}
          counts={k:int((cs.get(k) or {}).get('count') or 0) for k in cats}
          print('FINAL LIVE ITEMS',len(n.get('items') or []))
          print('FINAL LIVE CATEGORIES',json.dumps(counts))
          if len(n.get('items') or []) < 300: sys.exit('News snapshot still too small after four batches')
          if sum(x==0 for x in counts.values())>1: sys.exit('More than one category remains empty')
          print('NEWS CORE BATCHED COVERAGE VERIFIED')
          PY
