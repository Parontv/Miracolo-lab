name: Deploy Miracolo Lab News Core
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miracolo-lab-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build batched persistent News Core
        run: python scripts/build-news-core.py
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5637f51ea89c44719b4a680b6122bf05
          command: deploy
      - name: Verify News Core
        run: |
          python - <<'PY'
          import json,urllib.request,sys
          base='https://miracolo-lab.listaconcerti.workers.dev'
          h={'User-Agent':'MiracoloLab-NewsCore-Verification/4.0'}
          def get(p): return json.load(urllib.request.urlopen(urllib.request.Request(base+p,headers=h),timeout=90))
          v=get('/version')
          live=get('/api/live')
          n=live.get('news') or live
          cs=n.get('categorySummary') or {}
          items=n.get('items') or []
          cats=['news','finance','crypto','macro','rates','central','commodities','fx','volatility','geopolitics','social','company']
          counts={k:int((cs.get(k) or {}).get('count') or 0) for k in cats}
          print('VERSION',v.get('build'))
          print('ITEMS',len(items))
          print('CATEGORIES',json.dumps(counts))
          if len(items)<100: sys.exit('Initial news snapshot unexpectedly small')
          if sum(x==0 for x in counts.values())>3: sys.exit('Too many empty categories')
          print('NEWS CORE DEPLOY VERIFIED')
          PY
