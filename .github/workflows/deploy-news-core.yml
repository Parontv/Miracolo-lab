name: Deploy Miracolo Lab News Core
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miracolo-lab-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build persistent batched News Core
        run: python scripts/build-news-core.py
      - name: Expand market universe
        run: python scripts/patch-market-universe.py
      - name: Expand institutional and macro source universe
        run: python scripts/patch-source-universe.py
      - name: Add structured institutional data
        run: python scripts/patch-institutional-data.py
      - name: Add retail social sentiment
        run: python scripts/patch-social-data.py
      - name: Add crypto onchain data
        run: python scripts/patch-onchain-data.py
      - name: Enforce Workers Free data budget
        run: python scripts/patch-free-budget.py
      - name: Add Market chart endpoint
        run: python scripts/patch-market-chart.py
      - name: Harden crypto price fallbacks
        run: python scripts/patch-crypto-reliability.py
      - name: Stabilize News Core live endpoint
        run: python scripts/patch-news-live.py
      - name: Patch dashboard market rendering
        run: python scripts/patch-dashboard-indices.py
      - name: Validate generated Worker and dashboard before deploy
        run: |
          node --check worker.js
          node --check public/v1/dashboard.js
          node --check public/v1/news-feed-bridge.js
          node --check public/v1/market.js
          node --check public/v1/investments.js
          node --check public/v1/investment-charts.js
          node tests/news-contract.test.js
          node tests/market-ui.test.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); ui=Path('public/v1/dashboard.js').read_text(); data=Path('public/v1/data.js').read_text(); bridge=Path('public/v1/news-feed-bridge.js').read_text()
          if re.search(r'(?<!async )\bfunction botMonitor\s*\(', s): raise SystemExit('botMonitor must remain async')
          if re.search(r'(?<![A-Za-z0-9_])market\(\)', s): raise SystemExit('Unbound market() call remains; all routes must use market(env)')
          for marker in ["SECTOR_TECH:'XLK'","US3M:'^IRX'","USDBRL:'BRL=X'","SOURCE_EXPANSION_V1","CFTC General","SEC Latest 8-K","SNB Official","BoE Official","OPEC Official","IMF Official","async function institutionalData","async function socialData","async function onchainData","const DATA_ADAPTERS=","json-institutional","json-social","json-onchain","runDataAdapter","institutionalData:institutional","socialData:social","onchainData:onchain","marketUniverseVersion:'DATA-EXPANSION-V1'","marketUniverse:Object.keys(MARKET)","/api/market-monitor-v2","BATCH=12","MARKET_BATCH=18","MARKET_SNAPSHOT_KEY","const RL_MEM=new Map"]:
            if marker not in s: raise SystemExit('Missing generated worker marker: '+marker)
          if "const BUILD='ML-20260910-DATA-EXPANSION-V1';" not in s: raise SystemExit('Missing final DATA-EXPANSION-V1 build stamp')
          if "positions:t.rows.map" not in Path('public/v1/investments.js').read_text(): raise SystemExit('Missing per-position investment history')
          if "investment-charts.js?v=1.0.0" not in Path('public/index.html').read_text(): raise SystemExit('Missing investment charts UI')
          if "async function chartData(symbol,period='5d')" not in s or "/api/chart" not in s: raise SystemExit('Missing Market chart endpoint')
          if "api.exchange.coinbase.com/products/BTC-EUR/ticker" not in s or "api.exchange.coinbase.com/products/ETH-EUR/ticker" not in s: raise SystemExit('Missing crypto fallback')
          if re.search(r'for\(let attempt=0;attempt<2;attempt\+\+\)',s): raise SystemExit('News feed retry loop exceeds free-plan budget')
          if ".filter(x=>x.ok)" in ui: raise SystemExit('Dashboard contains an ok-only market filter')
          if "function extractNews(payload)" not in data or "const candidates=[payload.news,payload.scan,payload.snapshot,payload.data,payload]" not in data: raise SystemExit('News feed snapshot adapter hardening missing')
          if "window.ML.on('data',sync)" not in bridge or "window.S.state?.scan" in bridge: pass
          news_budget=12*2+5*2; market_budget=18+1+2+3+1+1+2+7+6
          if news_budget>50 or market_budget>50: raise SystemExit('Free external subrequest budget exceeded')
          kv_writes_day=288*3
          if kv_writes_day>1000: raise SystemExit('Free KV write budget exceeded')
          print('WORKER SYNTAX: PASS'); print('DASHBOARD MARKET FILTER GUARD: PASS'); print('NEWS FEED ADAPTER: PASS'); print('NEWS FEED SUBMENUS: PASS'); print('SOURCE EXPANSION: PASS'); print('FREE SUBREQUEST BUDGET: PASS',news_budget,market_budget); print('FREE KV WRITE BUDGET: PASS',kv_writes_day)
          PY
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5637f51ea89c44719b4a680b6122bf05
        run: npx wrangler@4 deploy
      - name: Verify deployed build, full market universe and UI
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'; expected='ML-20260910-DATA-EXPANSION-V1'
          def get(path):
              nonce=str(time.time_ns()); return json.load(urllib.request.urlopen(urllib.request.Request(base+path+('?ts='+nonce if '?' not in path else '&ts='+nonce),headers={'User-Agent':'MiracoloLab-Deployment-Verification/8.0','Cache-Control':'no-cache','Pragma':'no-cache'}),timeout=60))
          version=None
          for attempt in range(10):
              try:
                  version=get('/version'); print('VERSION CHECK',attempt+1,version.get('build'))
                  if version.get('build')==expected: break
              except Exception as e: print('VERSION RETRY',attempt+1,str(e))
              time.sleep(3)
          if not version or version.get('build')!=expected: sys.exit('Deployed Worker build stamp is not DATA-EXPANSION-V1 after propagation window')
          health=get('/api/health')
          if not health.get('ok'): sys.exit('Health endpoint failed')
          prices=get('/api/prices?symbols=GOLD,SWDA,XMME')
          crypto=get('/api/crypto')
          pmap={str(x.get('symbol','')).upper():x for x in prices.get('prices') or []}
          cmap={str(x.get('symbol','')).upper():x for x in crypto.get('coins') or []}
          if not pmap.get('GOLD',{}).get('ok'): sys.exit('Portfolio GOLD price unavailable after deployment')
          if not cmap.get('BTC',{}).get('ok') or not cmap.get('ETH',{}).get('ok'): sys.exit('Portfolio crypto prices unavailable after deployment')
          if float(pmap['GOLD'].get('price') or 0)<=0 or float(cmap['BTC'].get('price') or 0)<=0 or float(cmap['ETH'].get('price') or 0)<=0: sys.exit('Portfolio price payload contains invalid zero values')
          nonce=str(time.time_ns()); html=urllib.request.urlopen(urllib.request.Request(base+'/?ts='+nonce,headers={'User-Agent':'MiracoloLab-UI-Verification/4.0','Cache-Control':'no-cache','Pragma':'no-cache'}),timeout=30).read().decode('utf-8','replace')
          for marker,msg in [('data.js?v=1.4.1','hardened data.js'),('dashboard.js?v=1.4.4','dashboard.js'),('news-feed-bridge.js?v=1.0.0','News Feed bridge'),('strategy-lab.js?v=2.0.0','Strategy Lab'),('market.js?v=1.0.0','Market tab'),('investment-charts.js?v=1.0.0','Investment charts'),('lightweight-charts@5.2.1','Lightweight Charts'),('Miracolo Lab','header')]:
              if marker not in html: sys.exit('Deployed UI missing '+msg)
          if 'sl2-submenu' in html: sys.exit('Deployed HTML still contains legacy Strategy Lab submenu markup')
          print('PORTFOLIO GOLD PRICE: PASS',pmap['GOLD'].get('price'))
          print('PORTFOLIO BTC PRICE: PASS',cmap['BTC'].get('price'))
          print('PORTFOLIO ETH PRICE: PASS',cmap['ETH'].get('price'))
          chart=json.load(urllib.request.urlopen(urllib.request.Request(base+'/api/chart?symbol=%5EGSPC&period=5d',headers={'User-Agent':'MiracoloLab-Chart-Verification/1.0','Cache-Control':'no-cache'}),timeout=30))
          if not chart.get('ok') or len(chart.get('candles') or [])<2: sys.exit('Market chart endpoint failed')
          print('MARKET CHART API: PASS',len(chart.get('candles') or []),'candles')
          print('DEPLOYED UI ENTRYPOINTS: PASS'); print('LEGACY STRATEGY SUBMENU: ABSENT')
          PY
      - name: Verify News Core after deployment
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'; h={'User-Agent':'MiracoloLab-NewsCore-Verification/12.0','Cache-Control':'no-cache'}
          cats=['news','finance','crypto','macro','rates','central','commodities','fx','volatility','geopolitics','social','company']
          def get_live():
              raw=json.load(urllib.request.urlopen(urllib.request.Request(base+'/api/live?ts='+str(time.time_ns()),headers=h),timeout=30)); live=raw.get('news') or raw; cs=live.get('categorySummary') or {}; return live,{k:int((cs.get(k) or {}).get('count') or 0) for k in cats}
          samples=[]
          for attempt in range(6):
              try:
                  live,counts=get_live(); total=len(live.get('items') or []); print('LIVE CHECK',attempt+1,'ITEMS',total,'CATEGORIES',json.dumps(counts))
                  if total>=100 and sum(x==0 for x in counts.values())<=4:
                      samples.append((total,counts))
                      if len(samples)>=2 and samples[-1]==samples[-2]: print('NEWS CORE LIVE VERIFIED: stable snapshot and category counts'); break
              except Exception as e: print('LIVE RETRY',attempt+1,str(e))
              time.sleep(3)
          else: sys.exit('LIVE snapshot did not provide a stable valid News Core state')
          PY
