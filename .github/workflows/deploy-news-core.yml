name: Deploy Miracolo Lab News Core
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miracolo-lab-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build persistent batched News Core
        run: python scripts/build-news-core.py
      - name: Stabilize News Core live endpoint
        run: python scripts/patch-news-live.py
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5637f51ea89c44719b4a680b6122bf05
          command: deploy
      - name: Verify News Core after deployment
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'
          h={'User-Agent':'MiracoloLab-NewsCore-Verification/8.0'}
          cats=['news','finance','crypto','macro','rates','central','commodities','fx','volatility','geopolitics','social','company']
          def get(p):
              return json.load(urllib.request.urlopen(urllib.request.Request(base+p,headers=h),timeout=120))
          last=None
          for attempt in range(2):
              try:
                  last=get('/api/full-scan'); break
              except Exception as e:
                  print('FULL SCAN RETRY',attempt+1,str(e)); time.sleep(3)
          if last is None:
              sys.exit('News Core full scan unavailable after deployment')
          full_cs=last.get('categorySummary') or {}
          full_counts={k:int((full_cs.get(k) or {}).get('count') or 0) for k in cats}
          print('FULL SCAN ITEMS',len(last.get('items') or []))
          print('FULL SCAN CATEGORIES',json.dumps(full_counts))
          live=None
          live_counts={}
          for attempt in range(10):
              try:
                  raw=get('/api/live'); candidate=raw.get('news') or raw
                  live_cs=candidate.get('categorySummary') or {}
                  live_counts={k:int((live_cs.get(k) or {}).get('count') or 0) for k in cats}
                  print('LIVE CHECK',attempt+1,'ITEMS',len(candidate.get('items') or []),'CATEGORIES',json.dumps(live_counts))
                  if len(candidate.get('items') or []) >= 100 and sum(x==0 for x in live_counts.values()) <= 4 and live_counts == full_counts:
                      live=candidate
                      break
              except Exception as e:
                  print('LIVE RETRY',attempt+1,str(e))
              time.sleep(3)
          if live is None:
              sys.exit('LIVE snapshot did not converge to FULL SCAN snapshot after retries')
          print('LIVE ITEMS',len(live.get('items') or []))
          print('LIVE CATEGORIES',json.dumps(live_counts))
          print('NEWS CORE DEPLOY VERIFIED')
          PY
