name: Deploy Miracolo Lab News Core
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miracolo-lab-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build persistent batched News Core
        run: python scripts/build-news-core.py
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5637f51ea89c44719b4a680b6122bf05
          command: deploy
      - name: Verify News Core after deployment
        run: |
          python - <<'PY'
          import json,urllib.request,sys,time
          base='https://miracolo-lab.listaconcerti.workers.dev'
          h={'User-Agent':'MiracoloLab-NewsCore-Verification/6.0'}
          cats=['news','finance','crypto','macro','rates','central','commodities','fx','volatility','geopolitics','social','company']
          def get(p):
              return json.load(urllib.request.urlopen(urllib.request.Request(base+p,headers=h),timeout=120))
          last=None
          for attempt in range(2):
              try:
                  last=get('/api/full-scan'); break
              except Exception as e:
                  print('FULL SCAN RETRY',attempt+1,str(e)); time.sleep(3)
          if last is None:
              sys.exit('News Core full scan unavailable after deployment')
          cs=last.get('categorySummary') or {}
          counts={k:int((cs.get(k) or {}).get('count') or 0) for k in cats}
          print('FULL SCAN ITEMS',len(last.get('items') or []))
          print('FULL SCAN CATEGORIES',json.dumps(counts))
          live=get('/api/live'); live=live.get('news') or live
          cs=live.get('categorySummary') or {}
          counts={k:int((cs.get(k) or {}).get('count') or 0) for k in cats}
          print('LIVE ITEMS',len(live.get('items') or []))
          print('LIVE CATEGORIES',json.dumps(counts))
          if len(live.get('items') or []) < 100: sys.exit('News snapshot unexpectedly small')
          if sum(x==0 for x in counts.values())>4: sys.exit('Too many empty categories after deployment')
          print('NEWS CORE DEPLOY VERIFIED')
          PY
