name: Maintenance Feed Timeout
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Increase feed fetch timeout only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old="setTimeout(()=>c.abort(),9000)"
          new="setTimeout(()=>c.abort(),20000)"
          if old not in s:
              raise SystemExit('expected timeout string not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git commit -m 'Increase News Core feed timeout to 20s'
          git push
