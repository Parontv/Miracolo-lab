name: Bot Validation

on:
  push:
    branches: [main, fix/bot-consensus-v3, fix/bot-ai-fred-live-20261029, fix/fred-proxy-fallback-20261029, fix/fred-public-proxy-fallback-20261029]
    paths:
      - 'bot-server-engine.js'
      - 'bot-context-enrichment.js'
      - 'bot-risk-engine.js'
      - 'bot-crypto-engine.js'
      - 'news-event-engine.js'
      - 'bot-paper-executor.js'
      - 'bot-paper-auto.js'
      - 'live-worker.js'
      - 'public/bot-controller.js'
      - 'public/bot-workspace.js'
      - 'public/v1/tab-navigation.js'
      - 'public/index.html'
      - 'tests/**'
      - '.github/workflows/bot-validation.yml'
  pull_request:
    paths:
      - 'bot-server-engine.js'
      - 'bot-risk-engine.js'
      - 'bot-crypto-engine.js'
      - 'news-event-engine.js'
      - 'bot-paper-executor.js'
      - 'bot-paper-auto.js'
      - 'live-worker.js'
      - 'public/bot-controller.js'
      - 'public/bot-workspace.js'
      - 'public/v1/tab-navigation.js'
      - 'public/index.html'
      - 'tests/**'
      - '.github/workflows/bot-validation.yml'

jobs:
  validate-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check — canonical runtime
        run: |
          node --check bot-server-engine.js
          node --check bot-risk-engine.js
          node --check bot-crypto-engine.js
          node --check news-event-engine.js
          node --check bot-paper-executor.js
          node --check bot-paper-auto.js
          node --check live-worker.js
          node --check public/bot-controller.js
          node --check public/bot-workspace.js
          node --check public/v1/tab-navigation.js
      - name: Unified decision engine contract
        run: node tests/bot-server-engine.test.mjs
      - name: Consensus v3 regression
        run: node tests/bot-consensus-v3.test.mjs
      - name: Risk guardrail regression
        run: node tests/bot-risk-engine.test.mjs
      - name: Canonical UI behavior
        run: node tests/bot-engine.behavior.test.js
      - name: BTC and Paper execution contracts
        run: node tests/crypto-paper.test.mjs
      - name: Market and News contracts
        run: node tests/market-ui.test.js && node tests/news-contract.test.js
