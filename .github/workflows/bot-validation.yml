name: Bot Validation

on:
  push:
    branches: [main]
    paths:
      - 'bot-server-engine.js'
      - 'bot-risk-engine-v1.js'
      - 'bot-macro-engine-v1.js'
      - 'bot-crypto-engine-v1.js'
      - 'news-event-engine-v1.js'
      - 'bot-paper-executor-v1.js'
      - 'bot-paper-auto-v1.js'
      - 'live-worker.js'
      - 'tests/bot-engine.behavior.test.js'
      - 'tests/bot-pipeline-v1.test.mjs'
      - 'tests/crypto-paper.test.mjs'
      - 'tests/bot-server-engine.test.mjs'
      - 'public/v1/bot-engine.js'
      - 'public/v1/bot-workspace-v2.js'
  pull_request:
    paths:
      - 'bot-server-engine.js'
      - 'bot-risk-engine-v1.js'
      - 'bot-macro-engine-v1.js'
      - 'bot-crypto-engine-v1.js'
      - 'news-event-engine-v1.js'
      - 'bot-paper-executor-v1.js'
      - 'bot-paper-auto-v1.js'
      - 'live-worker.js'
      - 'tests/bot-engine.behavior.test.js'
      - 'tests/bot-pipeline-v1.test.mjs'
      - 'tests/crypto-paper.test.mjs'
      - 'tests/bot-server-engine.test.mjs'
      - 'public/v1/bot-engine.js'
      - 'public/v1/bot-workspace-v2.js'

jobs:
  validate-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check bot-server-engine.js
          node --check bot-risk-engine-v1.js
          node --check bot-macro-engine-v1.js
          node --check bot-crypto-engine-v1.js
          node --check news-event-engine-v1.js
          node --check bot-paper-executor-v1.js
          node --check bot-paper-auto-v1.js
          node --check live-worker.js
          node --check public/v1/bot-engine.js
          node --check public/v1/bot-workspace-v2.js
      - name: Unified engine contract
        run: node tests/bot-server-engine.test.mjs
      - name: Pipeline behavior
        run: node tests/bot-engine.behavior.test.js && node tests/bot-pipeline-v1.test.mjs
      - name: BTC crypto and Paper execution contracts
        run: node tests/crypto-paper.test.mjs
