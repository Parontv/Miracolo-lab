name: Bot Validation

on:
  push:
    branches: [main]
    paths:
      - 'bot-server-engine-v10.js'
      - 'bot-server-engine-v11.js'
      - 'bot-risk-engine-v1.js'
      - 'news-event-engine-v1.js'
      - 'live-worker.js'
      - 'tests/bot-v10.test.mjs'
      - 'tests/bot-v11.test.mjs'
      - 'public/v1/bot-engine.js'
      - 'public/v1/bot-workspace-v1.js'
  pull_request:
    paths:
      - 'bot-server-engine-v10.js'
      - 'bot-server-engine-v11.js'
      - 'bot-risk-engine-v1.js'
      - 'news-event-engine-v1.js'
      - 'live-worker.js'
      - 'tests/bot-v10.test.mjs'
      - 'tests/bot-v11.test.mjs'
      - 'public/v1/bot-engine.js'
      - 'public/v1/bot-workspace-v1.js'

jobs:
  validate-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check bot-server-engine-v10.js
          node --check bot-server-engine-v11.js
          node --check bot-risk-engine-v1.js
          node --check news-event-engine-v1.js
          node --check live-worker.js
          node --check public/v1/bot-engine.js
          node --check public/v1/bot-workspace-v1.js
      - name: V10 behavioral and quantitative tests
        run: node tests/bot-v10.test.mjs
      - name: V11 news and risk contract tests
        run: node tests/bot-v11.test.mjs
