name: Restore consolidated app runtime
on:
  workflow_dispatch:

# Disabled as an automatic push workflow. The V1 runtime is now the protected baseline;
# automatic checkout of an older app.js must never overwrite it after a deployment.
jobs:
  restore:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy restore workflow disabled; V1 runtime remains protected."
