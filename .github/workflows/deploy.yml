name: Deploy Miracolo Lab
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install V8 News Core
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          s=s.replace("const BUILD='ML-20260906-V4-NEWS-TRANSPORT';", "const BUILD='ML-20260906-V8-NEWS-SEQUENTIAL-24FEEDS';")
          start=s.find('async function scan(){')
          end=s.find('\nasync function quote(',start)
          core=Path('v8-news-core.js').read_text()
          if start<0 or end<0: raise SystemExit('scan boundaries not found')
          p.write_text(s[:start]+core+s[end:])
          print('V8 installed')
          PY
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5637f51ea89c44719b4a680b6122bf05
          command: deploy
      - name: Verify
        run: |
          python - <<'PY'
          import json,urllib.request
          b='https://miracolo-lab.listaconcerti.workers.dev'
          for path in ['/version','/api/live','/api/full-scan']:
            try:
              d=json.load(urllib.request.urlopen(urllib.request.Request(b+path,headers={'User-Agent':'MiracoloLab-Diagnostic/1.0'}),timeout=90))
              if path=='/version': print('VERSION',d.get('build'))
              elif path=='/api/live':
                n=d.get('news') or {};s=n.get('summary') or {};print('LIVE',json.dumps({'items':len(n.get('items') or []),'reachable':s.get('reachable'),'failed':s.get('failed'),'categories':{k:v.get('count') for k,v in (n.get('categorySummary') or {}).items()}}))
              else:
                s=d.get('summary') or {};print('FULL',json.dumps({'items':len(d.get('items') or []),'reachable':s.get('reachable'),'failed':s.get('failed'),'categories':{k:v.get('count') for k,v in (d.get('categorySummary') or {}).items()}}))
            except Exception as e: print('ERROR',path,e)
          PY
